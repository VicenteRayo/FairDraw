# Serves the built SPA. Deliberately unaware of any public subpath — when deployed behind
# WebVicente's reverse proxy (see ../docker-compose.prod.yml), the "/proyectos/fairdraw/" prefix is
# already stripped before the request reaches this container.
server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
